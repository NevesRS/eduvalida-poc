name: EduValida Caliper — SkillToken ERC-6909 em Besu QBFT
description: Benchmark do contrato SkillToken (issueSkill, hasSkill, revoke) na rede Besu local

test:
  workers:
    number: 1
  rounds:
    - label: issueSkill
      description: Instituição emite (cunha) skill para aluno — tx write
      txNumber: 100
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: caliper/workloads/issueSkill.js
        arguments:
          skillCount: 10

    - label: hasSkill
      description: Consulta view hasSkill (sem tx on-chain, só RPC)
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: caliper/workloads/hasSkill.js
        arguments:
          skillCount: 10

    - label: revoke
      description: Instituição revoga (queima) skill emitida — tx write
      txNumber: 50
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: caliper/workloads/revokeSkill.js
        arguments:
          skillCount: 5
          txNumber: 50

    # --- Métodos de escrita do owner (admin) ---
    - label: createSkill
      description: Owner cria novo tipo de skill — tx write
      txNumber: 50
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: caliper/workloads/createSkill.js

    - label: setSkillName
      description: Owner reescreve o nome de um skillType — tx write
      txNumber: 50
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: caliper/workloads/setSkillName.js

    - label: setSkillBadgeURI
      description: Owner define a URI do Open Badge — tx write
      txNumber: 50
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: caliper/workloads/setSkillBadgeURI.js

    - label: setSkillThreshold
      description: Owner atualiza o threshold de multi-sig — tx write
      txNumber: 50
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: caliper/workloads/setSkillThreshold.js

    - label: setIssuer
      description: Owner credencia/descredencia uma instituição emissora — tx write
      txNumber: 50
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: caliper/workloads/setIssuer.js

    # --- Métodos de leitura (view/pure) ---
    - label: skillId
      description: Cálculo puro do id ERC-6909 (pure) — sem tx on-chain
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: caliper/workloads/skillId.js

    - label: skillAttestationCount
      description: Conta instituições que atestaram a skill (view) — sem tx on-chain
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: caliper/workloads/skillAttestationCount.js
        arguments:
          skillCount: 1

    - label: hasSkillFrom
      description: Verifica skill de uma instituição específica (view) — sem tx on-chain
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: caliper/workloads/hasSkillFrom.js
        arguments:
          skillCount: 1

    - label: getKnownSkillTypes
      description: Lista todos os skillTypes conhecidos (view) — sem tx on-chain
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: caliper/workloads/getKnownSkillTypes.js

    - label: getIssuersList
      description: Lista instituições autorizadas (view) — sem tx on-chain
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: caliper/workloads/getIssuersList.js

    - label: getters
      description: Getters públicos (balanceOf, totalSupply, skillNames...) — sem tx on-chain
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: caliper/workloads/getters.js

    - label: throughput
      description: Throughput máximo de issueSkill
      txDuration: 5
      rateControl:
        type: maximum-rate
        opts:
          maxTps: 500
      workload:
        module: caliper/workloads/issueSkill.js
        arguments:
          skillCount: 20

monitor:
  type:
    - default
