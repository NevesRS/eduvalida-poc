name: EduValida Caliper — SkillTokenV1 ERC-1155 em Besu QBFT
description: Benchmark do contrato SkillTokenV1 (ERC-1155) — 15 rounds, comparação 1:1 com ERC-6909
test:
  workers:
    number: 1
  rounds:
    - label: issueSkill-1155
      description: Instituição emite (cunha) skill para aluno — tx write
      txNumber: 100
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: caliper/workloads/issueSkill.js
        arguments:
          skillCount: 10
          contractKey: SkillTokenV1
    - label: hasSkill-1155
      description: Consulta view hasSkill (sem tx on-chain, só RPC)
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: caliper/workloads/hasSkill.js
        arguments:
          skillCount: 10
          contractKey: SkillTokenV1
    - label: revoke-1155
      description: Instituição revoga (queima) skill emitida — tx write
      txNumber: 50
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: caliper/workloads/revokeSkill.js
        arguments:
          skillCount: 5
          txNumber: 50
          contractKey: SkillTokenV1
    - label: createSkill-1155
      description: Owner cria novo tipo de skill — tx write
      txNumber: 50
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: caliper/workloads/createSkill.js
        arguments:
          contractKey: SkillTokenV1
    - label: setSkillName-1155
      description: Owner reescreve o nome de um skillType — tx write
      txNumber: 50
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: caliper/workloads/setSkillName.js
        arguments:
          contractKey: SkillTokenV1
    - label: setSkillBadgeURI-1155
      description: Owner define a URI do Open Badge — tx write
      txNumber: 50
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: caliper/workloads/setSkillBadgeURI.js
        arguments:
          contractKey: SkillTokenV1
    - label: setSkillThreshold-1155
      description: Owner atualiza o threshold de multi-sig — tx write
      txNumber: 50
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: caliper/workloads/setSkillThreshold.js
        arguments:
          contractKey: SkillTokenV1
    - label: setIssuer-1155
      description: Owner credencia/descredencia uma instituição emissora — tx write
      txNumber: 50
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: caliper/workloads/setIssuer.js
        arguments:
          contractKey: SkillTokenV1
    - label: skillId-1155
      description: Cálculo puro do id ERC-6909 (pure) — sem tx on-chain
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: caliper/workloads/skillId.js
        arguments:
          contractKey: SkillTokenV1
    - label: skillAttestationCount-1155
      description: Conta instituições que atestaram a skill (view) — sem tx on-chain
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: caliper/workloads/skillAttestationCount.js
        arguments:
          skillCount: 1
          contractKey: SkillTokenV1
    - label: hasSkillFrom-1155
      description: Verifica skill de uma instituição específica (view) — sem tx on-chain
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: caliper/workloads/hasSkillFrom.js
        arguments:
          skillCount: 1
          contractKey: SkillTokenV1
    - label: getKnownSkillTypes-1155
      description: Lista todos os skillTypes conhecidos (view) — sem tx on-chain
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: caliper/workloads/getKnownSkillTypes.js
        arguments:
          contractKey: SkillTokenV1
    - label: getIssuersList-1155
      description: Lista instituições autorizadas (view) — sem tx on-chain
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: caliper/workloads/getIssuersList.js
        arguments:
          contractKey: SkillTokenV1
    - label: getters-1155
      description: Getters públicos (balanceOf, totalSupply, skillNames...) — sem tx on-chain
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: caliper/workloads/getters.js
        arguments:
          contractKey: SkillTokenV1
    - label: throughput-1155
      description: Throughput máximo de issueSkill
      txDuration: 5
      rateControl:
        type: maximum-rate
        opts:
          maxTps: 500
      workload:
        module: caliper/workloads/issueSkill.js
        arguments:
          skillCount: 20
          contractKey: SkillTokenV1
monitor:
  type:
    - default
